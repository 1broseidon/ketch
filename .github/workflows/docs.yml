name: Deploy Docs

on:
  push:
    branches: [main]
    paths: ['site/**', 'install.sh']
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: site/package-lock.json

      - name: Stage install script
        run: |
          mkdir -p site/public
          cp install.sh site/public/install
          cp install.sh site/public/install.sh

      - name: Install and build
        run: cd site && npm ci && npm run build
        env:
          # The version comes from git tags (fetch-depth: 0 above), but the
          # star count is an API call — authenticate it so a shared runner
          # can't exhaust the anonymous 60/hr limit and render a blank count.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: site/.vitepress/dist
          cname: ketch.run
