name: release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to release"
        required: true
        type: string

jobs:
  ref:
    runs-on: ubuntu-latest
    outputs:
      ref: ${{ steps.ref.outputs.ref }}
    steps:
      - id: ref
        run: |
          if [ -n "${{ inputs.tag }}" ]; then
            echo "ref=${{ inputs.tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "ref=${{ github.ref }}" >> "$GITHUB_OUTPUT"
          fi

  release:
    needs: ref
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ needs.ref.outputs.ref }}

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - run: go test ./...

      - uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          version: latest
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Pushes the winget manifest branch to our winget-pkgs fork and opens
          # the PR on microsoft/winget-pkgs; GITHUB_TOKEN cannot reach either.
          WINGET_TOKEN: ${{ secrets.WINGET_TOKEN }}

  npm:
    needs: [ref, release]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Required for npm trusted publishing: lets the job mint an OIDC token,
      # which npm exchanges for a short-lived publish credential. No secret.
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.ref.outputs.ref }}

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      # OIDC exchange needs npm >= 11.5.1; pin ahead of whatever Node ships.
      - run: npm install -g npm@latest

      # Downloads the release archives, verifies each against checksums.txt,
      # and writes npm/platforms/* plus the stamped root package.
      - name: Build packages
        run: node npm/build.mjs "${{ needs.ref.outputs.ref }}"

      # Platform packages first: the root pins them as optionalDependencies.
      # Provenance is generated automatically under trusted publishing, so
      # --provenance is deliberately absent.
      - name: Publish platform packages
        run: |
          set -eu
          for dir in npm/platforms/*/; do
            echo "==> $dir"
            npm publish "$dir" --access public
          done

      # Publishing in order is not enough. Every package is cached at the
      # registry CDN under its own ~5 minute TTL, so they become publicly
      # readable at independent times regardless of publish order. Publishing
      # the root while a binary is still invisible is silently destructive: npm
      # treats the unresolvable optionalDependency as absent rather than
      # failing, installs a ketch-cli with no binary, and npx then caches that
      # broken tree indefinitely. v0.17.1 left a ~150s window of exactly this.
      #
      # Poll the same unauthenticated URL a user's npm hits — no cache-busting
      # query, or we would be checking an origin the installer never sees.
      - name: Wait for the platform packages to be publicly readable
        run: |
          set -eu
          version="$(node -p "require('./npm/package.json').version")"
          export version
          echo "waiting for @ketch-cli/*@$version"
          for target in darwin-arm64 darwin-x64 linux-arm64 linux-x64 win32-arm64 win32-x64; do
            for attempt in $(seq 1 60); do
              if curl -fsS "https://registry.npmjs.org/@ketch-cli%2F$target" -o /tmp/doc.json 2>/dev/null \
                 && node -e 'const d=require("/tmp/doc.json");process.exit(d.versions&&d.versions[process.env.version]?0:1)'; then
                echo "  $target ok (after $(( (attempt - 1) * 10 ))s)"
                break
              fi
              if [ "$attempt" -eq 60 ]; then
                echo "::error::@ketch-cli/$target@$version was not publicly readable after 10m"
                exit 1
              fi
              sleep 10
            done
          done

      # Only now can the root safely pin them.
      - name: Publish root package
        run: |
          set -eu
          echo "==> npm/ (root)"
          npm publish npm/ --access public
