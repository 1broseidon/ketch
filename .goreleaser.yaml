version: 2

project_name: ketch

builds:
  - id: ketch
    main: .
    binary: ketch
    env:
      - CGO_ENABLED=0
    goos:
      - darwin
      - linux
      - windows
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w
      - -X github.com/1broseidon/ketch/cmd.version=v{{ .Version }}
      - -X github.com/1broseidon/ketch/cmd.commit={{ .ShortCommit }}
      - -X github.com/1broseidon/ketch/cmd.date={{ .Date }}

archives:
  - id: ketch
    ids:
      - ketch
    formats:
      - tar.gz
    format_overrides:
      - goos: windows
        formats:
          - zip
    name_template: >-
      {{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ if eq .Arch "amd64" }}x86_64{{ else }}{{ .Arch }}{{ end }}

checksum:
  name_template: checksums.txt

snapshot:
  version_template: "{{ .Version }}-next"

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"
      - "^ci:"
